name: Build Fabric Mod for Minecraft 1.16.5

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Setup JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Create Project Structure
      run: |
        mkdir -p src/main/java/com/autobridge
        mkdir -p src/main/resources/assets/autobridge/lang
        mkdir -p gradle/wrapper
        
    - name: Create AutoBridgeMod.java
      run: |
        cat > src/main/java/com/autobridge/AutoBridgeMod.java << 'JAVAEOF'
        package com.autobridge;

        import net.fabricmc.api.ClientModInitializer;
        import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
        import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
        import net.minecraft.client.MinecraftClient;
        import net.minecraft.client.option.KeyBinding;
        import net.minecraft.client.util.InputUtil;
        import net.minecraft.text.LiteralText;
        import net.minecraft.util.hit.BlockHitResult;
        import net.minecraft.util.math.BlockPos;
        import net.minecraft.util.math.Direction;
        import net.minecraft.util.math.Vec3d;
        import net.minecraft.item.BlockItem;
        import net.minecraft.item.ItemStack;
        import net.minecraft.util.Hand;
        import net.minecraft.util.ActionResult;
        import org.lwjgl.glfw.GLFW;

        public class AutoBridgeMod implements ClientModInitializer {
            
            private static boolean enabled = false;
            private static KeyBinding toggleKey;
            private static KeyBinding placeKey;
            
            @Override
            public void onInitializeClient() {
                System.out.println("[AutoBridge] Initializing Auto Bridge Mod v1.0.0");
                
                toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                    "key.autobridge.toggle",
                    InputUtil.Type.KEYSYM,
                    GLFW.GLFW_KEY_B,
                    "category.autobridge"
                ));
                
                placeKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                    "key.autobridge.place",
                    InputUtil.Type.KEYSYM,
                    GLFW.GLFW_KEY_V,
                    "category.autobridge"
                ));
                
                ClientTickEvents.END_CLIENT_TICK.register(client -> {
                    if (client.player == null || client.world == null) return;
                    
                    while (toggleKey.wasPressed()) {
                        enabled = !enabled;
                        String status = enabled ? "§a[AutoBridge] Enabled" : "§c[AutoBridge] Disabled";
                        client.player.sendMessage(new LiteralText(status), true);
                    }
                    
                    if (enabled && placeKey.isPressed()) {
                        tryPlaceBridge(client);
                    }
                });
                
                System.out.println("[AutoBridge] Mod loaded successfully!");
            }
            
            private void tryPlaceBridge(MinecraftClient client) {
                try {
                    if (client.player == null || client.world == null || client.interactionManager == null) {
                        return;
                    }
                    
                    Vec3d lookVec = client.player.getRotationVec(1.0F);
                    BlockPos playerPos = client.player.getBlockPos();
                    
                    int offsetX = Math.abs(lookVec.x) > Math.abs(lookVec.z) ? (lookVec.x > 0 ? 1 : -1) : 0;
                    int offsetZ = Math.abs(lookVec.z) >= Math.abs(lookVec.x) ? (lookVec.z > 0 ? 1 : -1) : 0;
                    
                    BlockPos targetPos = playerPos.add(offsetX, -1, offsetZ);
                    
                    if (!client.world.getBlockState(targetPos).isAir()) {
                        return;
                    }
                    
                    Hand hand = Hand.MAIN_HAND;
                    ItemStack stack = client.player.getMainHandStack();
                    
                    if (!(stack.getItem() instanceof BlockItem)) {
                        stack = client.player.getOffHandStack();
                        hand = Hand.OFF_HAND;
                        
                        if (!(stack.getItem() instanceof BlockItem)) {
                            for (int i = 0; i < 9; i++) {
                                ItemStack slot = client.player.inventory.getStack(i);
                                if (slot.getItem() instanceof BlockItem) {
                                    client.player.inventory.selectedSlot = i;
                                    stack = slot;
                                    hand = Hand.MAIN_HAND;
                                    break;
                                }
                            }
                        }
                    }
                    
                    if (!(stack.getItem() instanceof BlockItem)) {
                        return;
                    }
                    
                    BlockHitResult hit = new BlockHitResult(
                        Vec3d.ofCenter(targetPos),
                        Direction.UP,
                        targetPos,
                        false
                    );
                    
                    ActionResult result = client.interactionManager.interactBlock(
                        client.player, client.world, hand, hit
                    );
                    
                    if (result.isAccepted()) {
                        client.player.swingHand(hand);
                    }
                } catch (Exception e) {
                    e.printStackTrace();
                }
            }
        }
        JAVAEOF
        
    - name: Create fabric.mod.json
      run: |
        cat > src/main/resources/fabric.mod.json << 'JSONEOF'
        {
          "schemaVersion": 1,
          "id": "autobridge",
          "version": "1.0.0",
          "name": "Auto Bridge Mod",
          "description": "Automatically place blocks while moving",
          "authors": ["AutoBridge"],
          "contact": {},
          "license": "MIT",
          "icon": "assets/autobridge/icon.png",
          "environment": "client",
          "entrypoints": {
            "client": ["com.autobridge.AutoBridgeMod"]
          },
          "mixins": [],
          "depends": {
            "fabricloader": ">=0.11.3",
            "minecraft": "1.16.5",
            "fabric": "*"
          }
        }
        JSONEOF
        
    - name: Create Language File
      run: |
        cat > src/main/resources/assets/autobridge/lang/en_us.json << 'LANGEOF'
        {
          "key.autobridge.toggle": "Toggle Auto Bridge",
          "key.autobridge.place": "Place Block",
          "category.autobridge": "Auto Bridge"
        }
        LANGEOF
        
    - name: Create build.gradle
      run: |
        cat > build.gradle << 'GRADLEEOF'
        plugins {
            id 'fabric-loom' version '0.7-SNAPSHOT'
            id 'maven-publish'
        }

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        archivesBaseName = project.archives_base_name
        version = project.mod_version
        group = project.maven_group

        repositories {
            maven { url 'https://maven.fabricmc.net/' }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        }

        processResources {
            inputs.property "version", project.version

            filesMatching("fabric.mod.json") {
                expand "version": project.version
            }
        }

        tasks.withType(JavaCompile) {
            options.encoding = "UTF-8"
        }

        java {
            withSourcesJar()
        }
        GRADLEEOF
        
    - name: Create gradle.properties
      run: |
        cat > gradle.properties << 'PROPSEOF'
        org.gradle.jvmargs=-Xmx3G
        org.gradle.parallel=true
        
        minecraft_version=1.16.5
        yarn_mappings=1.16.5+build.10
        loader_version=0.11.7
        fabric_version=0.42.0+1.16
        
        mod_version=1.0.0
        maven_group=com.autobridge
        archives_base_name=autobridge
        PROPSEOF
        
    - name: Create settings.gradle
      run: |
        cat > settings.gradle << 'SETTINGSEOF'
        pluginManagement {
            repositories {
                maven { 
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net/'
                }
                gradlePluginPortal()
            }
        }
        rootProject.name = 'autobridge'
        SETTINGSEOF
        
    - name: Setup Gradle Wrapper
      run: |
        cat > gradle/wrapper/gradle-wrapper.properties << 'WRAPEOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.0-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        WRAPEOF
        
    - name: Download Gradle Wrapper Files
      run: |
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v7.0.0/gradle/wrapper/gradle-wrapper.jar
        curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v7.0.0/gradlew
        curl -L -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v7.0.0/gradlew.bat
        chmod +x gradlew
        
    - name: Validate Setup
      run: |
        echo "=== Project Structure ==="
        find src -type f
        echo "=== Gradle Files ==="
        ls -lh gradle/wrapper/gradle-wrapper.jar
        ls -lh gradlew
        
    - name: Build with Gradle
      run: |
        ./gradlew clean build --stacktrace --info
      
    - name: List Build Output
      if: always()
      run: |
        echo "=== Build Output ==="
        ls -lh build/libs/ || echo "No build output"
        
    - name: Upload Mod JAR
      uses: actions/upload-artifact@v3
      with:
        name: AutoBridge-Mod-1.16.5-Fabric
        path: build/libs/*.jar
        if-no-files-found: error
        retention-days: 90
